name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate pink contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-settings.json

      - name: Change language chart colors to pastel
        run: |
          python <<'PY'
          import re
          from pathlib import Path

          svg_path = Path("profile-3d-contrib/profile-pink.svg")

          if not svg_path.exists():
              raise FileNotFoundError(
                  f"생성된 SVG 파일을 찾을 수 없습니다: {svg_path}"
              )

          # 기존 GitHub 언어 색상 → 파스텔 색상
          language_colors = {
              "#b07219": "#D8B4FE",  # Java: 연보라
              "#3572A5": "#F9A8D4",  # Python: 연핑크
              "#555555": "#BFDBFE",  # C: 파스텔 블루
              "#3178C6": "#FDE68A",  # TypeScript: 파스텔 옐로
              "#E34C26": "#A7F3D0",  # HTML: 파스텔 민트
              "#444444": "#E9D5FF"   # Other: 아주 연한 보라
          }

          svg = svg_path.read_text(encoding="utf-8")
          total_replaced = 0

          for old_color, new_color in language_colors.items():
              svg, replaced_count = re.subn(
                  re.escape(old_color),
                  new_color,
                  svg,
                  flags=re.IGNORECASE
              )
              total_replaced += replaced_count

          if total_replaced == 0:
              raise RuntimeError(
                  "언어 그래프 색상을 찾지 못했습니다."
              )

          svg_path.write_text(svg, encoding="utf-8")

          print(
              f"언어 그래프 색상 {total_replaced}곳을 "
              "파스텔 색상으로 변경했습니다."
          )
          PY

            - name: Enlarge date text
              run: |
                python <<'PY'
                import re
                import xml.etree.ElementTree as ET
                from pathlib import Path
      
                svg_path = Path("profile-3d-contrib/profile-pink.svg")
      
                if not svg_path.exists():
                    raise FileNotFoundError(
                        f"생성된 SVG 파일을 찾을 수 없습니다: {svg_path}"
                    )
      
                ET.register_namespace("", "http://www.w3.org/2000/svg")
                ET.register_namespace("xlink", "http://www.w3.org/1999/xlink")
      
                tree = ET.parse(svg_path)
                root = tree.getroot()
      
                def local_name(tag):
                    return tag.rsplit("}", 1)[-1]
      
                date_pattern = re.compile(
                    r"\d{4}-\d{2}-\d{2}\s*/\s*\d{4}-\d{2}-\d{2}"
                )
      
                found = False
      
                for element in root.iter():
                    if local_name(element.tag) != "text":
                        continue
      
                    text = "".join(element.itertext()).strip()
      
                    if date_pattern.fullmatch(text):
                        style = element.get("style", "")
      
                        if "font-size" in style:
                            style = re.sub(
                                r"font-size\s*:\s*[^;]+",
                                "font-size: 18px",
                                style
                            )
                        else:
                            style += "; font-size: 18px"
      
                        if "font-weight" in style:
                            style = re.sub(
                                r"font-weight\s*:\s*[^;]+",
                                "font-weight: 600",
                                style
                            )
                        else:
                            style += "; font-weight: 600"
      
                        element.set("style", style.strip("; "))
                        found = True
                        break
      
                if not found:
                    raise RuntimeError("날짜 텍스트를 찾지 못했습니다.")
      
                tree.write(
                    svg_path,
                    encoding="utf-8",
                    xml_declaration=True
                )
      
                print("날짜 크기 수정 완료")
                PY

      - name: Commit and push generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if ! git diff --cached --quiet; then
            git commit -m "style: update pastel language chart"
            git push
          fi
