name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    name: generate-github-profile-3d-contrib

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Generate pink contribution graph
        uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-settings.json

      - name: Change language graph colors to pastel
        run: |
          python <<'PY'
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          svg_path = Path("profile-3d-contrib/profile-pink.svg")

          if not svg_path.exists():
              raise FileNotFoundError(
                  f"생성된 SVG 파일을 찾을 수 없습니다: {svg_path}"
              )

          # 언어별로 순서대로 적용될 파스텔 색상
          pastel_colors = [
              "#CDB4DB",  # 라벤더
              "#FFC8DD",  # 연핑크
              "#BDE0FE",  # 파우더 블루
              "#FFE5B4",  # 피치
              "#CDEAC0",  # 연민트
              "#E2D1F9"   # 연보라: other
          ]

          ET.register_namespace("", "http://www.w3.org/2000/svg")
          ET.register_namespace(
              "xlink",
              "http://www.w3.org/1999/xlink"
          )

          tree = ET.parse(svg_path)
          root = tree.getroot()

          def local_name(tag):
              return tag.rsplit("}", 1)[-1]

          # 각 요소의 부모를 찾기 위한 맵
          parent_map = {
              child: parent
              for parent in root.iter()
              for child in parent
          }

          # title을 자식으로 가진 path가 언어 원형 그래프 조각
          pie_paths = []

          for element in root.iter():
              if local_name(element.tag) != "path":
                  continue

              has_title = any(
                  local_name(child.tag) == "title"
                  for child in element
              )

              if has_title:
                  pie_paths.append(element)

          if not pie_paths:
              raise RuntimeError("언어 원형 그래프를 찾지 못했습니다.")

          if len(pie_paths) > len(pastel_colors):
              raise RuntimeError(
                  "언어 개수보다 준비된 파스텔 색상이 적습니다."
              )

          # 원형 그래프 전체 그룹 찾기
          pie_path_group = parent_map[pie_paths[0]]
          pie_root_group = parent_map[pie_path_group]

          # 같은 그룹 내부의 범례 사각형 찾기
          legend_rects = [
              element
              for element in pie_root_group.iter()
              if local_name(element.tag) == "rect"
          ]

          if len(legend_rects) < len(pie_paths):
              raise RuntimeError("언어 범례를 모두 찾지 못했습니다.")

          # 원형 그래프 색상 변경
          for index, path in enumerate(pie_paths):
              color = pastel_colors[index]
              style = path.get("style", "")

              if re.search(r"fill\s*:", style):
                  style = re.sub(
                      r"fill\s*:\s*[^;]+",
                      f"fill: {color}",
                      style,
                      count=1
                  )
              else:
                  style = f"{style}; fill: {color}".strip("; ")

              path.set("style", style)

          # 언어 이름 옆 범례 색상 변경
          for index, rect in enumerate(
              legend_rects[:len(pie_paths)]
          ):
              rect.set("fill", pastel_colors[index])

          tree.write(
              svg_path,
              encoding="utf-8",
              xml_declaration=True
          )

          print(
              f"{len(pie_paths)}개의 언어 그래프 색상을 "
              "파스텔 톤으로 변경했습니다."
          )
          PY

      - name: Commit and push generated graph
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com

          git add -A .

          if ! git diff --cached --quiet; then
            git commit -m "chore: update pink contribution graph"
            git push
          fi
